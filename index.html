<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CUSTOMIZE: Browser tab title -->
    <title>Will You Be My Valentine? 💝</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Floating Background Elements -->
    <div class="floating-elements">
        <!-- Hearts and bears will be added here by JavaScript -->
    </div>

    <!-- Cute Popup Modal -->
    <div class="popup-modal hidden" id="cutePopup">
        <div class="popup-content">
            <span class="popup-close" onclick="closePopup()">&times;</span>
            <div class="popup-emoji">💕</div>
            <h3 id="popupTitle">You're Amazing!</h3>
            <p id="popupMessage">I love you so much!</p>
            <button class="popup-btn" onclick="closePopup()">Close ❤️</button>
        </div>
    </div>

    <!-- Main Content Container -->
    <div class="container">
        <h1 id="valentineTitle"></h1>
        
        <!-- Image Section -->
        <div class="image-section">
            <img id="valentineImage" src="https://images.unsplash.com/photo-1518895949257-7621c3c786d7?w=400&q=80" alt="You are beautiful" class="valentine-image">
            <div class="image-caption">💕 You are beautiful 💕</div>
        </div>
        
        <!-- Music Player -->
        <div id="musicControls" class="music-controls">
            <button id="musicToggle" class="music-btn">🎵 Play Music</button>
            <audio id="bgMusic" loop>
                <source id="musicSource" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </div>

        <!-- First Question -->
        <div class="question-section" id="question1">
            <h2 id="question1Text"></h2>
            <button class="cute-btn" onclick="handleYesClick(1)" id="yesBtn1"></button>
            <button class="cute-btn no-btn" id="noBtn1"></button>
            <div class="secret-answer">
                <button class="cute-btn special" onclick="showNextQuestion(2)" id="secretAnswerBtn"></button>
            </div>
        </div>

        <!-- Second Question (Funny) -->
        <div class="question-section hidden" id="question2">
            <h2 id="question2Text"></h2>
            <button class="cute-btn" onclick="handleYesClick(2)" id="yesBtn2"></button>
            <button class="cute-btn no-btn" id="noBtn2"></button>
        </div>

        <!-- Third Question (Smile) -->
        <div class="question-section hidden" id="question3">
            <h2 id="question3Text"></h2>
            <button class="cute-btn" onclick="handleYesClick(3)" id="yesBtn3"></button>
            <button class="cute-btn no-btn" id="noBtn3"></button>
        </div>

        <!-- Fourth Question (Love Meter) -->
        <div class="question-section hidden" id="question4">
            <h2 id="question4Text"></h2>
            <div class="love-meter">
                <input type="range" min="0" max="10000" value="100" class="slider" id="loveMeter">
                <p>
                    <span class="love-value-container"><span id="startText"></span> (<span id="loveValue">100</span>%)</span>
                    <span id="extraLove" class="hidden"></span>
                </p>
            </div>
            <button class="cute-btn" onclick="showNextQuestion(5)" id="nextBtn"></button>
        </div>

        <!-- Fifth Question (Travel) -->
        <div class="question-section hidden" id="question5">
            <h2 id="question5Text"></h2>
            <button class="cute-btn" onclick="handleYesClick(5)" id="yesBtn5"></button>
            <button class="cute-btn no-btn" id="noBtn5"></button>
        </div>

        <!-- Sixth Question (Final) -->
        <div class="question-section hidden" id="question6">
            <h2 id="question6Text"></h2>
            <button class="cute-btn final-yes" onclick="celebrate()" id="yesBtn6"></button>
            <button class="cute-btn no-btn" id="noBtn6"></button>
        </div>

        <!-- CUSTOMIZE: Celebration message -->
        <div class="celebration hidden" id="celebration">
            <h2 id="celebrationTitle"></h2>
            <p class="celebration-text" id="celebrationMessage"></p>
            <p class="celebration-text" id="celebrationEmojis"></p>
        </div>
    </div>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="theme.js"></script>
    <script src="script.js"></script>
</body>
</html>
